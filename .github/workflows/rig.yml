# The rig standard, green before any commit merges:
# Last full green test XML (2026-11-28): 443 protocol + 167 core + 254 app +
# 108 harness = 972 tests, 0 failures, 0 errors, 0 skipped, read from the four
# modules' JUnit XML. The full rig rerun (tests plus assemblies) is green after
# the R8 keep-rule change; assemblies are outside the XML result.
# Earlier figures (the projected four-module 362 + 112 + 212 + 92 = 778 and the
# three-module 362 + 324 + 92 = 778) are historical.
name: rig

on:
  push:
  pull_request:

concurrency:
  group: rig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (platform 36, licenses)
        uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" >/dev/null

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: rig
        # No env.sh here — that pins the author's local JDK paths; JAVA_HOME
        # from setup-java is enough. Release builds without the (local-only,
        # gitignored) keystore.properties fall back to the debug key.
        run: >
          ./gradlew --no-daemon --stacktrace
          :protocol:test :core:test :app:testDebugUnitTest :harness:test
          :app:assembleDebug :app:assembleRelease
          :harness:installDist :harness:distZip

      - name: CLI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: flit-cli
          path: harness/build/distributions/flit-cli-*.zip
          if-no-files-found: error
