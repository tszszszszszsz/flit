Name: Flit
AutoName: Flit
Summary: >-
  Send files across your Wi-Fi without accounts, cables, or the cloud.
FullDescription: >-
  Flit moves files between the devices around you, directly over your Wi-Fi
  network. Open the app and everything on the same network appears. No
  accounts, no pairing ceremony, nothing leaves the LAN. Transfers ride mutual
  TLS with per-device identities and fingerprint pinning, interrupted
  transfers resume, and received files stream straight into your chosen
  folder.

  When there is no Wi-Fi network between two devices at all — mobile data
  only, a dead access point — the roster keeps working: discovery and the
  exchange ride Bluetooth at exactly that moment, the same secure protocol,
  the same list. Bluetooth is opt-in under **Transfer over Bluetooth** in
  Options and is off by default; the only prompts are the system's own, each
  asked once per device.

