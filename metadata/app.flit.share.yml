FullDescription: >-
  Flit moves files between the devices around you, directly over your Wi-Fi
  network. Open the app and everything on the same network appears. No
  accounts, no pairing ceremony, nothing leaves the LAN. Transfers ride mutual
  TLS with per-device identities and fingerprint pinning, interrupted
  transfers resume, and received files stream straight into your chosen
  folder.

