org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.code.style=official
org.gradle.warning.mode=all
android.useAndroidX=true
android.enableJetifier=false
# Defensive default: R8 full mode does more aggressive rewriting (argument
# removal, merging). It did NOT itself cause the ART VerifyError (plain R8
# rewriting breaks netty buffer init — see app/proguard-rules.pro); staying on
# classic mode simply keeps behavior closest to the tested debug configuration.
android.enableR8.fullMode=false
